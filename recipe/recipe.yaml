schema_version: 1

context:
  version: 2.11.0

package:
  name: depfinder
  version: ${{ version }}

source:
  url: https://github.com/ericdill/depfinder/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 89014b6d9a5d559e8d189c9f990764a7e8e229203077074d58a320fd14de2b7d
  patches:
    - 0001-patch-manifest.patch

build:
  number: 0
  noarch: python
  script: 
    - export SETUPTOOLS_SCM_PRETEND_VERSION=${{ version }}
    - ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - depfinder = depfinder.cli:cli

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
    - setuptools-scm
  run:
    - python >=${{ python_min }}
    - pyyaml
    - requests
  run_constraints:
    - conda-forge-metadata >=0.14.0

tests:
  - python:
      imports:
        - depfinder
      python_version:
        - "${{ python_min }}.*"
        - "*"
  - requirements:
      run:
        - pip
    script:
      - pip check
      - depfinder --help

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Find all the unique imports in your library
  homepage: http://github.com/ericdill/depfinder

extra:
  recipe-maintainers:
    - ericdill
    - mariusvniekerk
    - tonyfast
    - ocefpaf
    - CJ-Wright
    - beckermr
